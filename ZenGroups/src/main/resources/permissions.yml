# ==========================================================
#  ZenGroups — права групп. Группа получает свои права + права из inherits (groups.yml).
#  "-право" — забрать право (например, унаследованное). "*" — все права сервера.
# ==========================================================

player:
  - zenquests.use
  - zenfishing.use

vip:
  - zengroups.chat.color

vipplus:
  - zenquests.premium      # Ферма+ (квесты и рыбалка) входит в VIP+

media:
  - minecraft.command.gamemode

moder:
  - minecraft.command.kick
  - minecraft.command.tp
  - zenquests.admin
  - zenfishing.admin

admin:
  - "*"
