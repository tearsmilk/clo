name: ZenGroups
version: '${version}'
main: ink.hoka.zengroups.ZenGroups
api-version: '1.21'
description: Группы и права — простая замена LuckPerms
website: https://hoka.ink
authors: [nakuZen]
softdepend: [Vault, PlaceholderAPI]
loadbefore: [TakuCore, ZenQuests, ZenFishing]

commands:
  group:
    description: Управление группами
    usage: /group add|set|take|info|list|reload
    aliases: [группа, zengroups, zg]

permissions:
  zengroups.admin:
    description: Команды /group
    default: op
