# Quastres
# Полублок = потушенный костёр в заданном состоянии. Плагин: ставит его по ПКМ предметом, ломает с дропом предмета,
# запрещает поджиг, готовку и смену сигнального флага, чтобы состояние (= внешний вид) не менялось.
protect-vanilla-campfire: true   # не давать тушить лопатой обычный горящий костёр (иначе он станет одной из наших плит)
messages:
  prefix: "&8[&bQuastres&8] &r"
  no-permission: "&cНет прав."
  reloaded: "&aПерезагружено: полублоков — {count}."
  unknown: "&cНет такого полублока: {id}. Список — /quastres list."
  given: "&aВыдано &f{count}× {name} &aигроку &f{player}&a."
  list: "&7Полублоки: &f{list}"
  cant-place: "&cЗдесь нельзя поставить."
