# ==========================================================
#  ZenFishing — рыбалка (https://hoka.ink)
#  Рыба — в fish.yml. Перезагрузка без рестарта: /рыбалка reload
#  Цвета: MiniMessage (<gradient:#a:#b>, <#ff8800>) и &-коды.
# ==========================================================

# ── Удочка: уровень и опыт хранятся на самом предмете (любая удочка при первом улове становится прокачиваемой) ──
rod:
  unbreakable: true      # удочки не ломаются (флаг на предмете + отмена урона прочности)
  max-level: 50
  # Опыт до следующего уровня: xp-base × xp-growth^(уровень−1)   (1→2: 100, 2→3: 125, 10→11: ~750 …)
  xp-base: 100
  xp-growth: 1.25
  # Улучшение удочки — одна кнопка в меню (F с удочкой в руке). Ступени по порядку: level — нужный уровень удочки (растёт от
  # рыбалки), cost — цена в монетах Vault, бонусы — доли (0.08 = +8%), значения ступени действуют целиком (не суммируются).
  tiers:
    - { level: 3,  cost: 300,   luck: 0.05, bite: 0.05, double: 0.01, sell: 0.02, xp: 0.05 }
    - { level: 6,  cost: 700,   luck: 0.10, bite: 0.10, double: 0.02, sell: 0.04, xp: 0.10 }
    - { level: 10, cost: 1500,  luck: 0.16, bite: 0.15, double: 0.04, sell: 0.07, xp: 0.15 }
    - { level: 15, cost: 3000,  luck: 0.24, bite: 0.20, double: 0.06, sell: 0.10, xp: 0.20 }
    - { level: 20, cost: 5500,  luck: 0.32, bite: 0.26, double: 0.08, sell: 0.14, xp: 0.25 }
    - { level: 26, cost: 9000,  luck: 0.42, bite: 0.32, double: 0.11, sell: 0.18, xp: 0.30 }
    - { level: 33, cost: 14000, luck: 0.54, bite: 0.40, double: 0.14, sell: 0.23, xp: 0.36 }
    - { level: 40, cost: 20000, luck: 0.66, bite: 0.48, double: 0.17, sell: 0.28, xp: 0.42 }
    - { level: 46, cost: 28000, luck: 0.78, bite: 0.55, double: 0.20, sell: 0.34, xp: 0.48 }
    - { level: 50, cost: 40000, luck: 0.90, bite: 0.60, double: 0.24, sell: 0.40, xp: 0.55 }
  bonus-names: { luck: "Удача", bite: "Клёв", double: "Двойной улов", sell: "Цена продажи", xp: "Опыт удочки" }
  bonus-line: "&7{name}: &a+{value}%"
  # Свой стиль подсказки удочки (ресурспак assets/zenfishing/textures/gui/sprites/tooltip/sea_*.png). Пусто — обычный.
  tooltip-style: "zenfishing:sea"
  name: "&b🎣 Удочка &7[&fур. {level}&7]"
  name-max: "&b🎣 Удочка &7[&6МАКС&7]"
  # {bonuses} — строки bonus-line по текущей ступени; {tier}/{max-tier} — ступень улучшения
  lore:
    - "&#3aace4━━━━━━━━━━━━━━"
    - "&7Опыт: &f{xp}&7/&f{need}"
    - "{bar}"
    - "&#3aace4━━━━━━━━━━━━━━"
    - "&7Улучшение: &f{tier}&7/&f{max-tier}"
    - "{bonuses}"
    - "&8F — улучшить удочку"
  lore-max:
    - "&#3aace4━━━━━━━━━━━━━━"
    - "&6✦ Максимальный уровень"
    - "&#3aace4━━━━━━━━━━━━━━"
    - "&7Улучшение: &f{tier}&7/&f{max-tier}"
    - "{bonuses}"
    - "&8F — улучшить удочку"
  bar: { length: 20, filled: "&b▮", empty: "&8▮" }

# ── Улов ──
catch:
  # От какой редкости и выше сообщать всему серверу: common, uncommon, rare, epic, legendary, none
  announce-from: epic
  sounds: true
  # Шансы редкостей (относительные веса) — в fish.yml у каждой редкости
  # Своя текстура рыбы из ресурспака: шаблон модели предмета, {id} — id рыбы из fish.yml
  # (assets/zenfishing/items/fish/<id>.json). Пусто "" — ванильные предметы. У рыбы можно задать свой model.
  item-model: "zenfishing:fish/{id}"
  # Стиль подсказки у пойманной рыбы (как у удочки). Пусто — обычный.
  tooltip-style: "zenfishing:sea"
  # Ночью (13000–23000 тиков) клюёт лучше: прибавка к скорости клёва и к удаче (доли)
  night:
    bite-speed: 0.3
    luck: 0.15
    message: true     # «Ночной клёв!» при редкой рыбе ночью
  # Подпись на рыбе: только название (цвет — по редкости). Описание пустое — рыба складывается в стак.
  name: "{color}{fish}"
  lore: []

# ── Вываживание (мини-игра после поклёвки) ──
# Когда рыба клюнула и игрок подсёк, в экшенбаре бежит маркер; нужно нажать Shift, когда он в зелёной зоне. Попаданий нужно
# hits (по редкости), после каждого зона переезжает и маркер ускоряется на speed-up. Промах сверх misses-allowed или пауза
# дольше timeout-ticks — рыба срывается (escape-xp — утешительный опыт удочке). «Клёв» удочки и Ферма+ расширяют зону.
minigame:
  enabled: true
  title: true
  display: betterhud     # betterhud — графическая полоса над экшенбаром (huds/fishfight в BetterHud, плейсхолдеры %zenfishing_fight_*%); actionbar — текстовая
  bar-length: 24
  timeout-ticks: 70
  misses-allowed: 0
  speed-up: 1.12
  zone-per-bite: 6       # + клеток зоны на каждые 100% бонуса «клёв» (0.3 → +1.8)
  zone-premium: 1
  escape-xp: 3
  rarity:
    common:    { hits: 1, zone: 8, speed: 0.70 }
    uncommon:  { hits: 2, zone: 7, speed: 0.85 }
    rare:      { hits: 3, zone: 6, speed: 1.00 }
    epic:      { hits: 4, zone: 5, speed: 1.15 }
    legendary: { hits: 5, zone: 4, speed: 1.30 }
  bar:
    format: "&b🎣 &8[{bar}&8] {dots}"
    wave: "&3≈"
    zone: "&a▮"
    marker: "&f◆"
    marker-in: "&e◆"
    hit: "&a●"
    todo: "&8●"

# ── Продажа (/рыбалка продать или кнопка в меню) ──
sell:
  # auto — Vault, если есть, иначе команда; vault; command
  method: auto
  # Команда консоли, если нет Vault. {player} — ник, {amount} — сумма
  command: "eco give {player} {amount}"
  currency: "монет"

# ── Ферма+ — подписка из ZenQuests (право zenquests.premium или /квесты premium give <ник> [срок]). Бонусы на рыбалке: ──
premium:
  permission: "zenquests.premium"
  name: "<gradient:#ffd34e:#ff9f1c>Ферма+</gradient>"
  xp-multiplier: 1.5     # опыт удочки ×1.5
  luck: 0.25             # +25% к шансу редкой рыбы
  bite-speed: 0.2        # клёв на 20% быстрее
  double-catch: 0.05     # +5% к шансу второй рыбы
  sell-bonus: 0.15       # +15% к цене
  upgrade-discount: 0.2  # скидка 20% на прокачку удочки за монеты
  exclusive-fish: true   # рыба с premium: true в fish.yml ловится только подписчикам
  perks:
    - "&7• Опыт удочки &6×1.5"
    - "&7• Шанс редкой рыбы &6+25%"
    - "&7• Клёв быстрее на &620%"
    - "&7• Вторая рыба за улов &6+5%"
    - "&7• Рыба дороже на &615%"
    - "&7• Прокачка удочки дешевле на &620%"
    - "&7• Особая рыба только для &6Ферма+"

# ── Меню /рыбалка ──
# Рыбацкий журнал — предмет, открывающий меню рыбалки по ПКМ (3D-модель из ресурспака: assets/zenfishing/models/item/fish_journal.json)
journal:
  enabled: true
  give-on-join: true     # выдать при первом входе (один раз; потом — /рыбалка журнал [игрок])
  model: "zenfishing:fish_journal"
  name: "&b📘 Рыбацкий журнал"
  lore:
    - "&#3aace4━━━━━━━━━━━━━━"
    - "&7ПКМ — открыть меню рыбалки"
    - "&8Улов, удочка, продажа рыбы"

# ── Рыболовные сети: предмет с 3D-моделью; 4 ПКМ по блокам/воде задают углы, сеть ложится на воду и ловит рыбу сама.
#    ПКМ по сети — забрать улов, Shift+ПКМ — снять. /рыбалка сеть — купить. Хранятся в nets.yml.
net:
  enabled: true
  price: 500               # цена покупки (/рыбалка сеть); 0 — бесплатно. Списывается через Vault
  model: "zenfishing:fishing_net"            # предмет в руке (assets/zenfishing/models/item/fishing_net.json)
  tile-model: "zenfishing:fishing_net_tile"  # плитка 1x1 на воде
  name: "&b🕸 Рыболовная сеть"
  lore:
    - "&#3aace4━━━━━━━━━━━━━━"
    - "&7ПКМ по 4 блокам или воде — углы сети"
    - "&7Ловит рыбу сама, пока ты занят"
    - "&#3aace4━━━━━━━━━━━━━━"
    - "&8ПКМ по сети — забрать улов, Shift+ПКМ — снять"
  max-size: 6              # максимальная сторона прямоугольника (блоков)
  min-tiles: 2             # минимум клеток
  min-water: 0.5           # доля клеток, под которыми должна быть вода
  max-per-player: 3
  max-per-player-premium: 5
  capacity: 8              # сколько рыбы вмещает сеть
  check-seconds: 60        # как часто сеть пробует поймать
  chance-per-tile: 0.04    # шанс поимки за проверку на одну клетку (6x6 = 0.6 → потолок max-chance)
  max-chance: 0.6
  luck: -0.2               # удача (редкость) относительно удочки: сеть ловит проще
  night-mult: 1.3          # ночью чаще
  premium-mult: 1.25       # Ферма+ владельца — чаще
  offline-premium: false   # считать ли Ферма+ у владельца не в сети (право проверить нельзя)
  notify: true             # сообщать владельцу о поимке, если он рядом (64 блока)

menu:
  title: "<gradient:#38b6ff:#5ce1e6>🎣 Рыбалка</gradient>"
  rod-title: "<gradient:#38b6ff:#5ce1e6>🎣 Удочка</gradient>"
  accent: LIGHT_BLUE_STAINED_GLASS_PANE
  corner: CYAN_STAINED_GLASS_PANE
  background: BLACK_STAINED_GLASS_PANE
  # Стиль подсказки из ресурспака (как у квестов). Пусто "" — обычный.
  tooltip-style: "zenfishing:sea"
  # Нарисованные фоны (ресурспак assets/zenfishing/font/menu.json + textures/gui/menu, scene): та же схема, что у квестов.
  textures:
    enabled: true
    font: "zenfishing:menu"
    title: false
    sequence: "\uE100\uE010\uE102\uE011\uE103\uE012\uE102\uE013\uE103{bg}\uE101"
    backgrounds: { main: "\uE000", rod: "\uE001", upgrade: "\uE002" }
    # отдельная последовательность для фона (без сцены по краям): меню улучшения — только вертикальная плашка
    sequences: { upgrade: "\uE100\uE002\uE101" }
  # Свои иконки кнопок (модели предметов, напр. zenquests:icon_close). Пусто — обычный предмет.
  icons: { close: "", back: "", prev: "", next: "", sell: "", top: "", premium-active: "", premium-inactive: "", collection: "", unknown: "", rod: "", empty: "zenfishing:invisible" }
  profile:
    name: "&b{player}"
    lore:
      - "&7Поймано рыбы: &f{caught}"
      - "&7Открыто видов: &f{known}&7/&f{total}"
      - "&7Самая редкая: &f{best}"
      - "&7Заработано: &e{earned} {currency}"
  rod:
    name: "&bУдочка в руке"
    none: ["&7Возьми удочку в руку,", "&7чтобы увидеть её уровень"]
  # Меню улучшения (F с удочкой в руке; фон — вертикальная плашка на колонках 1..7): удочка (4) и кнопка «Улучшить» (48..50).
  # Уровень, опыт и бонусы — в подсказке удочки; требования ступени — в подсказке кнопки. Предметы игрока скрыты (через TakuFarmers).
  upgrade:
    open-on-swap: true
    hide-inventory: true
    button:
      name: "&a▶ Улучшить &7— ступень &f{next-tier}&7/&f{max-tier}"
      name-locked: "&c▶ Улучшить &7— ступень &f{next-tier}&7/&f{max-tier}"
      lore: ["&7Монет: &e{money} {currency}", "", "&7Следующая ступень даст:"]
      req-level-ok: "&a✔ &7Уровень удочки: &f{need-level}"
      req-level-no: "&c✘ &7Уровень удочки: &f{need-level} &8(сейчас {level})"
      req-money-ok: "&a✔ &7Цена: &e{cost} {currency}"
      req-money-no: "&c✘ &7Цена: &e{cost} {currency} &8(есть {money})"
      hint: "&eНажми, чтобы улучшить"
      hint-locked: "&cПока недоступно"
      name-max: "&6✦ Удочка улучшена полностью"
      lore-max: ["&7Ступень &f{tier}&7/&f{max-tier}"]
  rod-none:
    name: "&cНет удочки"
    lore: ["&7Возьми удочку в руку", "&7и открой меню снова"]
  sell:
    name: "&eПродать всю рыбу"
    lore: ["&7Рыбы в инвентаре: &f{count}", "&7На сумму: &e{amount} {currency}", "", "&eНажми, чтобы продать"]
    item: GOLD_INGOT
  top:
    name: "&6Топ рыбаков"
    item: WRITABLE_BOOK
    line: "&7{n}. &f{player} &8— &f{value}"
    lore-caught: "&bПо улову:"
    lore-biggest: "&bПо видам:"
  premium:
    active: { name: "{premium} &aактивна", lore: ["&7Твои бонусы на рыбалке:", ""], item: GOLDEN_HOE }
    inactive: { name: "{premium}", lore: ["&7С подпиской на рыбалке:", ""], item: WHEAT }
  close: { name: "&cЗакрыть", item: BARRIER }
  back: { name: "&7← Назад", item: ARROW }
  prev: { name: "&7← Назад", item: ARROW }
  next: { name: "&7Вперёд →", item: ARROW }

