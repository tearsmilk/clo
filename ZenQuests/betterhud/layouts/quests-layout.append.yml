
# Квесты в худе (ZenQuests → PlaceholderAPI): сверху — сюжетный (%zenquests_hud_story_*%), под ним до 4 закреплённых ПКМ
# (%zenquests_hud_<n>_*%). Закреплённые сдвигаются вниз, когда сюжетный виден, поэтому у каждого два варианта позиции.
quests:
  texts:
    1:
      name: default_font
      pattern: "<image:quest_story> <#E9B8FF>✦ [papi:zenquests_hud_story_name] <#8F8F8F>— <#D0D0D0>[papi:zenquests_hud_story_desc]  <#9BE37D>[papi:zenquests_hud_story_progress]<#7A7A7A>//<#9BE37D>[papi:zenquests_hud_story_amount]"
      background: background
      align: right
      layer: 1
      x: -4
      y: 34
      conditions:
        1:
          first: "(number)papi:zenquests_hud_story_active"
          second: "'(number)1'"
          operation: '=='
