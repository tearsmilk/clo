name: ZenQuests
version: '${version}'
main: ink.hoka.zenquests.ZenQuests
api-version: '1.21'
description: Система квестов
website: https://hoka.ink
authors: [nakuZen]
softdepend: [TakuFarmers, Nexo, PlaceholderAPI]

commands:
  quests:
    description: Меню квестов
    usage: /квесты
    aliases: [квесты, квест, quest, zenquests, zq]
  ffly:
    description: Полёт на своей ферме (Ферма+)
    usage: /ffly
    aliases: [фф, farmfly]

permissions:
  zenquests.use:
    description: Открывать меню квестов
    default: true
  zenquests.admin:
    description: /квесты reload, reset, progress и premium
    default: op
  zenquests.ffly.free:
    description: /ffly без подписки Ферма+
    default: false
  zenquests.premium:
    description: Подписка Ферма+ (доп. квесты и бонусные награды)
    default: false
