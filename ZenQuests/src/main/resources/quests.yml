# ==========================================================
#  Квесты. Добавить новый — просто дописать блок.
#
#  Поля квеста:
#    name         — название (цвета/градиенты)
#    icon         — предмет-иконка в меню
#    description  — описание (список строк)
#    objective:
#      type       — что делать:
#                   BREAK   сломать блок        PLACE    поставить блок
#                   KILL    убить моба/игрока   FISH     выловить (ванильный предмет)
#                   CATCH_FISH   поймать рыбу ZenFishing   цель: id рыбы из fish.yml (carp, sturgeon …) или ANY
#                   CRAFT   скрафтить           SMELT    забрать из печи
#                   EAT     съесть/выпить       ENCHANT  зачаровать
#                   BREED   развести            TAME     приручить
#                   WALK    пройти блоков       PLAYTIME наиграть минут
#                 TakuFarmers (нужен TakuFarmers с API 1.0+):
#                   CROP_HIT      удачный удар мотыгой по выросшей культуре   цель: wheat, carrot, potato,
#                   CROP_HARVEST  собрать урожая (сколько выпало)                   onion, tomato, cucumber
#                   CROP_BREAK    срубить куст целиком (последний удар цикла)
#                   COOK          закончить готовку на станции               цель: id станции
#                   COOK_ITEM     приготовить блюдо (сколько выдано)         цель: предмет или id Nexo
#                   MILL          перемолоть на жёрнове (сколько выдано)     цель: предмет или id Nexo
#                   OBTAIN        получить предмет в инвентарь (мука из жёрнова) цель: материал или id Nexo (flour)
#                   FLOUR_SACK    скрафтить мешок муки                       без цели
#                   EARN / SPEND  заработать / потратить валюту              цель: COINS или GEMS
#                   FARM_VISIT    зайти на свою ферму                        без цели
#                   NPC_TALK      кликнуть по NPC                            цель: id NPC
#                   DIALOG        поговорить с NPC (F)                       цель: id диалога
#      targets    — что именно (имена Minecraft). Пусто или ANY — что угодно.
#                   Можно шаблоном: "*_LOG" (любые брёвна), "*_ORE" (любая руда)
#      amount     — сколько
#    rewards:
#      lines      — как награда выглядит в меню (игрок видит это)
#      commands   — что выполнит консоль. {player} — ник игрока
#    premium-rewards:  (необязательно) бонус для подписки Ферма+, выдаётся СВЕРХУ rewards
#      lines / commands — так же, как у rewards. Без подписки игрок видит бонус серым.
#    premium: true     (необязательно) квест виден только с Ферма+ (для сезонных)
#
#  Ферма+ (подписка, право zenquests.premium — см. config.yml):
#    daily.premium-count / premium-quests  — сколько и из чего выдавать подписчикам
#                                            дополнительно к обычным
#    weekly.premium-count / premium-quests — то же для недели
#    story.<цепочка>.premium: true         — вся цепочка только для Ферма+
#
#  Сюжетная цепочка: name, icon, description (строки под названием в меню), premium, steps
#    id премиум-квестов не должны совпадать с обычными
#
#  ежедневные: каждый день в 00:00 игроку выпадает count случайных из списка
#  еженедельные: каждый понедельник в 00:00 — count случайных из списка
#  сезонные: доступны все квесты сезона, пока идут даты start–end (включительно)
#  сюжетные: цепочки по шагам — следующий шаг открывается после награды за предыдущий
# ==========================================================

