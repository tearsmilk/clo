  # ── Новая сюжетная цепочка ──
  valley-chronicles:
    name: "<gradient:#c471f5:#fa71cd>Хроники Тихой долины</gradient>"
    icon: WRITABLE_BOOK
    description:
      - "&7Старый фермер оставил тебе заросший"
      - "&7участок и потрёпанный дневник."
      - "&7Верни долине былую славу."
    steps:
      arrival:
        name: "&fГлава I. Новый дом"
        icon: OAK_FENCE_GATE
        description:
          - "&8«Калитка скрипнула, будто здороваясь...»"
          - "&7Загляни на свою ферму."
        objective: { type: FARM_VISIT, amount: 1 }
        rewards:
          lines: ["&f• Каменная мотыга", "&f• 16 хлеба"]
          commands: ["minecraft:give {player} stone_hoe 1", "minecraft:give {player} bread 16"]
      overgrown:
        name: "&fГлава II. Заросли"
        icon: SHORT_GRASS
        description:
          - "&8«Сорняки по пояс. Пора за работу.»"
          - "&7Расчисти участок от травы и кустов."
        objective: { type: BREAK, targets: [SHORT_GRASS, TALL_GRASS, FERN, LARGE_FERN, DEAD_BUSH, BUSH], amount: 64 }
        rewards:
          lines: ["&f• 32 семян пшеницы", "&f• 50 опыта"]
          commands: ["minecraft:give {player} wheat_seeds 32", "minecraft:xp add {player} 50 points"]
      first-sowing:
        name: "&fГлава III. Первый посев"
        icon: WHEAT_SEEDS
        description:
          - "&8«В дневнике: сей, пока земля тёплая.»"
          - "&7Посади пшеницу."
        objective: { type: PLACE, targets: [WHEAT], amount: 32 }
        rewards:
          lines: ["&f• 16 костной муки", "&f• 80 опыта"]
          commands: ["minecraft:give {player} bone_meal 16", "minecraft:xp add {player} 80 points"]
      first-harvest:
        name: "&fГлава IV. Первый урожай"
        icon: WHEAT
        description:
          - "&8«Колосья звенят на ветру.»"
          - "&7Собери урожай мотыгой на ферме."
        objective: { type: CROP_HARVEST, amount: 64 }
        rewards:
          lines: ["&f• Железная мотыга", "&f• 3 изумруда"]
          commands: ["minecraft:give {player} iron_hoe 1", "minecraft:give {player} emerald 3"]
      neighbors:
        name: "&fГлава V. Соседи"
        icon: VILLAGER_SPAWN_EGG
        description:
          - "&8«В долине ещё остались люди.»"
          - "&7Поговори с жителями (NPC)."
        objective: { type: NPC_TALK, amount: 3 }
        rewards:
          lines: ["&f• 5 изумрудов", "&f• 100 опыта"]
          commands: ["minecraft:give {player} emerald 5", "minecraft:xp add {player} 100 points"]
      old-mill:
        name: "&fГлава VI. Старая мельница"
        icon: GRINDSTONE
        description:
          - "&8«Жёрнов скрипит, но ещё мелет.»"
          - "&7Перемели зерно на жёрнове."
        objective: { type: MILL, amount: 32 }
        rewards:
          lines: ["&f• 200 опыта", "&f• 4 изумруда"]
          commands: ["minecraft:xp add {player} 200 points", "minecraft:give {player} emerald 4"]
      kitchen:
        name: "&fГлава VII. Тёплая кухня"
        icon: CAMPFIRE
        description:
          - "&8«Запах свежей выпечки на всю долину.»"
          - "&7Приготовь блюда на станции."
        objective: { type: COOK, amount: 10 }
        rewards:
          lines: ["&f• 6 золотых морковок", "&f• 250 опыта"]
          commands: ["minecraft:give {player} golden_carrot 6", "minecraft:xp add {player} 250 points"]
      market:
        name: "&fГлава VIII. Ярмарка"
        icon: EMERALD
        description:
          - "&8«Пора показать долине, на что способна ферма.»"
          - "&7Заработай монеты."
        objective: { type: EARN, targets: [COINS], amount: 3000 }
        rewards:
          lines: ["&f• 10 изумрудов", "&f• 300 опыта"]
          commands: ["minecraft:give {player} emerald 10", "minecraft:xp add {player} 300 points"]
      night-raid:
        name: "&cГлава IX. Ночные гости"
        icon: IRON_SWORD
        description:
          - "&8«Ночью кто-то топчет посевы...»"
          - "&7Защити ферму — убей монстров."
        objective: { type: KILL, targets: [ZOMBIE, SKELETON, SPIDER, CREEPER, HUSK, DROWNED, WITCH, PILLAGER], amount: 40 }
        rewards:
          lines: ["&f• Железный меч", "&f• Щит", "&f• 400 опыта"]
          commands: ["minecraft:give {player} iron_sword 1", "minecraft:give {player} shield 1", "minecraft:xp add {player} 400 points"]
      big-harvest:
        name: "&fГлава X. Большой урожай"
        icon: HAY_BLOCK
        description:
          - "&8«Амбары должны быть полны к осени.»"
          - "&7Собери много урожая на ферме."
        objective: { type: CROP_HARVEST, amount: 500 }
        rewards:
          lines: ["&f• Алмазная мотыга", "&f• 500 опыта"]
          commands: ["minecraft:give {player} diamond_hoe 1", "minecraft:xp add {player} 500 points"]
      diary-end:
        name: "<gradient:#ffd34e:#ff9f1c>Глава XI. Последняя страница</gradient>"
        icon: ENCHANTED_BOOK
        description:
          - "&8«Долина снова живёт. Спасибо тебе.»"
          - "&7Пройди путь фермера: срежь растения целиком."
        objective: { type: CROP_BREAK, amount: 100 }
        rewards:
          lines: ["&f• Тотем бессмертия", "&f• 3 алмаза", "&f• 1000 опыта"]
          commands: ["minecraft:give {player} totem_of_undying 1", "minecraft:give {player} diamond 3", "minecraft:xp add {player} 1000 points"]
