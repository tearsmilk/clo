  click-open-chain: "&e▶ Нажми, чтобы открыть историю"
  # Полоска прогресса: 20 символов bar-char, заполненные — bar-full, остальные — bar-empty
  bar-char: "|"
  bar-full: "&a"
  bar-empty: "&8"
  status-progress: "&7Прогресс: &f{progress}&7/&f{amount} &8({percent}%)"
