  premium-check: "&7Подписка &f{player}&7: осталось &f{time}"
  premium-check-perm: "&7У &f{player}&7 подписка через право (LuckPerms/донат), командой не управляется."
  premium-bad-term: "&cНепонятный срок: &f{term}&c. Примеры: 30d, 12h, 1w, 1d12h, forever"
