  player-not-found: "&cИгрок &f{player}&c не в сети."
  usage-admin: "&7/квесты reload &8— &fперезагрузить конфиги\n&7/квесты reset <игрок> [daily|weekly|seasonal|story|all] &8— &fсбросить прогресс\n&7/квесты progress <игрок> <тип> [цель|-] [кол-во] &8— &fзасчитать действие\n&7/квесты premium give|take|check <игрок> [срок] &8— &fвыдать / забрать / проверить подписку"
  unknown-type: "&cНеизвестный тип: &f{type}"
  progress-added: "&aИгроку &f{player}&a засчитано {type} ×{amount}"
  player-unknown: "&cИгрок &f{player}&c ещё ни разу не заходил на сервер."
  premium-given: "&aИгроку &f{player}&a выдана подписка Ферма+ — осталось: &f{time}"
