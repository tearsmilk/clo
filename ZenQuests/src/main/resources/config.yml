# ==========================================================
#  ZenQuests — настройки (https://hoka.ink)
#  Сами квесты — в quests.yml. Перезагрузка без рестарта: /квесты reload
#  Цвета: MiniMessage (<gradient:#a:#b>, <#ff8800>) и &-коды.
# ==========================================================

# Часовой пояс для сброса ежедневных (в 00:00) и еженедельных (в понедельник 00:00) квестов
timezone: "Europe/Moscow"

# true — награда выдаётся сразу при выполнении; false — игрок забирает её в меню
auto-claim: false

# Полоска прогресса сверху экрана на пару секунд, когда квест продвинулся
bossbar:
  enabled: true
  seconds: 3

# Не засчитывать ломание блоков, которые поставили игроки (защита от «поставил-сломал»).
# Помнит до рестарта сервера.
ignore-player-placed-blocks: true

menu:
  title: "<gradient:#4facfe:#00f2fe>✦ Квесты ✦</gradient>"
  # Стекло рамки главного меню
  accent: LIGHT_BLUE_STAINED_GLASS_PANE
  corner: CYAN_STAINED_GLASS_PANE
  background: BLACK_STAINED_GLASS_PANE
  # Стиль подсказки при наведении на предметы меню (нужен ресурспак со спрайтами
  # assets/zenquests/textures/gui/sprites/tooltip/farm_background.png и farm_frame.png).
  # Пусто "" — обычная подсказка Minecraft. Без ресурспака у игроков будет фиолетово-чёрная рамка!
  tooltip-style: "zenquests:farm"
  # Нарисованные фоны меню (ресурспак: assets/zenquests/font/menu.json + textures/gui/menu/*.png).
  # true — вместо стекла рамки окно рисуется картинкой. Без ресурспака у игроков будут квадратики в названии!
  textures:
    enabled: true
    font: "zenquests:menu"
    title: false   # true — печатать название окна текстом поверх картинки (на наших фонах оно уже на ленте)
  # Свои иконки кнопок меню (ресурспак: assets/zenquests/items/icon_*.json). Пусто "" — обычный предмет.
  icons:
    daily: "zenquests:icon_daily"
    weekly: "zenquests:icon_weekly"
    seasonal: "zenquests:icon_seasonal"
    story: "zenquests:icon_story"
    premium-active: "zenquests:icon_premium_on"
    premium-inactive: "zenquests:icon_premium_off"
    locked: "zenquests:icon_locked"
    claimed: "zenquests:icon_claimed"
    step-done: "zenquests:icon_step_done"
    step-locked: "zenquests:icon_step_locked"
    close: "zenquests:icon_close"
    back: "zenquests:icon_back"
    prev: "zenquests:icon_prev"
    next: "zenquests:icon_next"
    empty: "zenquests:icon_empty"
  # name/icon — карточка категории; pane/corner — цвет рамки её страницы; description — строки под названием
  categories:
    daily:
      name: "<gradient:#f9d423:#ff4e50>☀ Ежедневные</gradient>"
      icon: SUNFLOWER
      pane: YELLOW_STAINED_GLASS_PANE
      corner: ORANGE_STAINED_GLASS_PANE
      description: ["&7Новые задания каждый день", "&7в &f00:00&7 по Москве."]
    weekly:
      name: "<gradient:#00c6ff:#0072ff>⌚ Еженедельные</gradient>"
      icon: CLOCK
      pane: LIGHT_BLUE_STAINED_GLASS_PANE
      corner: BLUE_STAINED_GLASS_PANE
      description: ["&7Задания посложнее — на всю неделю.", "&7Обновляются в понедельник."]
    seasonal:
      name: "<gradient:#f7971e:#ffd200>❀ Сезонные</gradient>"
      icon: PUMPKIN_PIE
      pane: ORANGE_STAINED_GLASS_PANE
      corner: RED_STAINED_GLASS_PANE
      description: ["&7Особые задания сезона.", "&7Успей, пока сезон не кончился!"]
    story:
      name: "<gradient:#c471f5:#fa71cd>✎ Сюжетные</gradient>"
      icon: WRITABLE_BOOK
      pane: PURPLE_STAINED_GLASS_PANE
      corner: MAGENTA_STAINED_GLASS_PANE
      description: ["&7Цепочки заданий с историей.", "&7Каждый шаг открывает следующий."]

# ── Подписка Ферма+ ──
# Подписчик = игрок с правом из permission ИЛИ с подпиской, выданной командой.
#   Командой (оп / zenquests.admin, работает и для игроков не в сети):
#     /квесты premium give <ник> [срок]   срок: 30d, 12h, 1w, 1d12h, forever (по умолчанию навсегда)
#     /квесты premium take <ник>          /квесты premium check <ник>
#   Правом — донат-плагином или LuckPerms:
#     /lp user <ник> permission settemp zenquests.premium true 30d
# Что даёт: доп. квесты (premium-quests в quests.yml, premium: true у сезонных/сюжетных)
# и бонусные награды (premium-rewards у любого квеста).
premium:
  permission: "zenquests.premium"
  # Значок подписки для таба/чата через PlaceholderAPI: %zenquests_premium_badge% — badge, если подписка есть,
  # иначе badge-none. По умолчанию — глиф Nexo premium_badge (plugins/Nexo/glyphs/zenquests.yml), картинка в ресурспаке.
  # char в glyphs/zenquests.yml НЕ задавать руками: Nexo назначает его сам при reload и записывает в файл — оттуда и брать.
  # В TakuCore roles.yml:  tab: { suffix: " %zenquests_premium_badge%" }
  badge: "\uA41D"   # символ глифа premium_badge — Nexo сам назначает его и пишет в glyphs/zenquests.yml
  badge-none: ""
  name: "<gradient:#ffd34e:#ff9f1c>Ферма+</gradient>"
  quest-tag: "&6✦ Задание {premium}"
  bonus-title: "&6✦ Бонус {premium}&6:"
  bonus-title-locked: "&8✦ Бонус с {premium}&8:"
  chain-tag: "&6✦ Цепочка {premium}"
  chain-locked-lore:
    - "&6⛔ Только с подпиской {premium}"
    - "&7Оформи подписку, чтобы пройти"
    - "&7эту историю."
  locked-icon: GOLD_BLOCK
  locked-name: "&6⛔ Ещё {count} заданий с {premium}"
  locked-lore:
    - "&7Оформи подписку, чтобы открыть"
    - "&7дополнительные задания и бонусы."
  info-active:
    name: "{premium} &aактивна"
    icon: GOLDEN_HOE
    lore:
      - "&7Тебе доступны доп. задания"
      - "&7и бонусные награды. Спасибо! &6♥"
  info-inactive:
    name: "{premium}"
    icon: WHEAT
    lore:
      - "&7С подпиской:"
      - "&f• больше ежедневных и еженедельных"
      - "&f• свои сезонные и сюжетные задания"
      - "&f• бонус к награде за каждый квест"

